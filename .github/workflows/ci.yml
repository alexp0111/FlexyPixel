name: Flexy Pixel CI

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  Unit-test:
    name: Run unit tests on PR in master
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        api-level: [ 33 ]
        target: [ google_apis ]
        arch: [ x86_64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up java 17
        uses: actions/setup-java@v1
        with: { java-version: 17 }

      - name: Gradle cache
        uses: gradle/gradle-build-action@v2

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Run App tests
        run: ./gradlew app:testDebugUnitTest

      - name: Run Core tests
        run: ./gradlew core:testDebugUnitTest

      - name: Run Core-ui tests
        run: ./gradlew core-ui:testDebugUnitTest